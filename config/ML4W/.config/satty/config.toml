[general]

fullscreen = false

floating-hack = true

initial-tool = "brush"

copy-command = "wl-copy"

annotation-size-factor = 2

output-filename = "~/Pictures/Screenshots/screenshot_%Y%m%d_%H%M%S.jpg"

save-after-copy = true

default-hide-toolbars = false

disable-notifications = false

[font]

family = "Roboto"
style = "Regular"
